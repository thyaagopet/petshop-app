<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Shop</title>

<style>
body { font-family: Arial; background: #ffe4ec; padding: 15px; }
h1 { text-align: center; color: #e91e63; }
input, select, button {
  width: 100%; padding: 10px; margin-top: 5px;
  border-radius: 8px; border: none;
}
button { background: #e91e63; color: white; font-weight: bold; }
.card {
  background: white; padding: 15px;
  border-radius: 12px; margin-top: 15px;
}
</style>
</head>

<body>

<h1>🐶 Cão Turminha</h1>

<div class="card">
<h3>Cadastrar Tutor</h3>
<input id="tutorNome" placeholder="Nome">
<input id="tutorTel" placeholder="Telefone">
<button onclick="addTutor()">Salvar</button>
</div>

<div class="card">
<h3>Cadastrar Pet</h3>
<input id="petNome" placeholder="Nome do pet">
<select id="porte">
<option>Pequeno</option>
<option>Médio</option>
<option>Grande</option>
<option>Gigante</option>
</select>
<select id="tutorSelect"></select>
<button onclick="addPet()">Salvar Pet</button>
</div>

<div class="card">
<h3>Agenda</h3>
<select id="petSelect"></select>
<select id="servico">
<option>Banho</option>
<option>Tosa</option>
<option>Remoção</option>
<option>Pacote Semanal</option>
</select>
<button onclick="agendar()">Agendar</button>
<ul id="agenda"></ul>
</div>

<script>
let tutores = JSON.parse(localStorage.getItem("tutores")) || [];
let pets = JSON.parse(localStorage.getItem("pets")) || [];
let agenda = JSON.parse(localStorage.getItem("agenda")) || [];

function salvar() {
  localStorage.setItem("tutores", JSON.stringify(tutores));
  localStorage.setItem("pets", JSON.stringify(pets));
  localStorage.setItem("agenda", JSON.stringify(agenda));
}

function atualizarSelects() {
  tutorSelect.innerHTML = "";
  petSelect.innerHTML = "";

  tutores.forEach(t => {
    tutorSelect.innerHTML += `<option>${t.nome}</option>`;
  });

  pets.forEach(p => {
    petSelect.innerHTML += `<option>${p.nome}</option>`;
  });
}

function addTutor() {
  const nome = tutorNome.value;
  const tel = tutorTel.value;

  if (!nome) return;

  tutores.push({ nome, tel });
  salvar();
  atualizarSelects();

  tutorNome.value = "";
  tutorTel.value = "";
}

function addPet() {
  const nome = petNome.value;
  const porte = porte.value;
  const tutor = tutorSelect.value;

  if (!nome) return;

  pets.push({ nome, porte, tutor });
  salvar();
  atualizarSelects();

  petNome.value = "";
}

function agendar() {
  const pet = petSelect.value;
  const servico = servico.value;

  agenda.push({
    pet,
    servico,
    hora: new Date().toLocaleTimeString()
  });

  salvar();
  renderAgenda();
}

function renderAgenda() {
  agendaEl.innerHTML = "";
  agenda.forEach(a => {
    agendaEl.innerHTML += `<li>${a.hora} - ${a.pet} (${a.servico})</li>`;
  });
}

const tutorSelect = document.getElementById("tutorSelect");
const petSelect = document.getElementById("petSelect");
const agendaEl = document.getElementById("agenda");

atualizarSelects();
renderAgenda();
</script>

</body>
</html>
