<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Shop Pro+</title>

<style>
body { font-family: Arial; background:#ffe4ec; padding:10px;}
h1 { text-align:center; color:#e91e63;}
.card { background:white; padding:10px; border-radius:10px; margin-bottom:10px;}
input, select, button {
  width:100%; padding:8px; margin-top:5px; border-radius:6px; border:none;
}
button { background:#e91e63; color:white; font-weight:bold; margin-top:3px;}
table { width:100%; border-collapse:collapse; font-size:12px;}
th, td { border:1px solid #ccc; padding:5px; text-align:center;}
th { background:#e91e63; color:white;}

.status-agendado { color:blue; }
.status-confirmado { color:green; }
.status-cancelado { color:red; }
.status-faltou { color:orange; }
</style>
</head>

<body>

<h1>🐶 Pet Shop Pro+</h1>

<div class="card">
<h3>Tutor</h3>
<input id="tutorNome" placeholder="Nome">
<input id="tutorTel" placeholder="Telefone">
<button onclick="addTutor()">Salvar</button>
</div>

<div class="card">
<h3>Pet</h3>
<input id="petNome" placeholder="Nome do pet">
<select id="porte">
<option>Pequeno</option>
<option>Médio</option>
<option>Grande</option>
<option>Gigante</option>
</select>
<select id="tutorSelect"></select>
<button onclick="addPet()">Salvar Pet</button>
</div>

<div class="card">
<h3>Agendamento</h3>
<input type="date" id="data">
<input type="time" id="hora">
<select id="petSelect"></select>

<select id="servico">
<option value="50">Banho</option>
<option value="80">Tosa</option>
<option value="60">Remoção</option>
<option value="200">Pacote Semanal</option>
<option value="350">Pacote Quinzenal</option>
</select>

<button onclick="agendar()">Agendar</button>
<button onclick="lembretesHoje()">📲 Lembretes do Dia</button>
</div>

<div class="card">
<h3>Agenda</h3>
<table>
<thead>
<tr>
<th>Data</th>
<th>Hora</th>
<th>Pet</th>
<th>Tutor</th>
<th>Status</th>
<th>Ações</th>
</tr>
</thead>
<tbody id="lista"></tbody>
</table>
</div>

<script>
let tutores = JSON.parse(localStorage.getItem("tutores") || "[]");
let pets = JSON.parse(localStorage.getItem("pets") || "[]");
let agenda = JSON.parse(localStorage.getItem("agenda") || "[]");

function salvar(){
  localStorage.setItem("tutores", JSON.stringify(tutores));
  localStorage.setItem("pets", JSON.stringify(pets));
  localStorage.setItem("agenda", JSON.stringify(agenda));
}

function atualizar(){
  const tutorSelect = document.getElementById("tutorSelect");
  const petSelect = document.getElementById("petSelect");

  tutorSelect.innerHTML="";
  petSelect.innerHTML="";

  tutores.forEach(t=>{
    tutorSelect.innerHTML += `<option>${t.nome}</option>`;
  });

  pets.forEach(p=>{
    petSelect.innerHTML += `<option>${p.nome}</option>`;
  });
}

function addTutor(){
  let nome=tutorNome.value;
  let tel=tutorTel.value;
  if(!nome) return;

  tutores.push({nome,tel});
  salvar(); atualizar();
}

function addPet(){
  let nome=petNome.value;
  let porte=porte.value;
  let tutor=tutorSelect.value;

  if(!nome || !tutor) return;

  pets.push({nome,porte,tutor});
  salvar(); atualizar();
}

function agendar(){
  const data=document.getElementById("data").value;
  const hora=document.getElementById("hora").value;
  const petNome=document.getElementById("petSelect").value;

  if(!data||!hora||!petNome) return;

  const pet=pets.find(p=>p.nome===petNome);

  agenda.push({
    data,
    hora,
    pet:pet.nome,
    tutor:pet.tutor,
    status:"Agendado"
  });

  salvar();
  render();
}

function alterarStatus(index, novo){
  agenda[index].status = novo;
  salvar();
  render();
}

function enviarWhats(tel, tutorNome, pet, data, hora) {
  if (!tel) return;

  tel = tel.replace(/\D/g, "");
  if (!tel.startsWith("55")) tel = "55" + tel;

  let dataObj = new Date(data);
  let amanha = new Date();
  amanha.setDate(amanha.getDate()+1);

  let ehAmanha = dataObj.toDateString() === amanha.toDateString();

  let msg = `Olá ${tutorNome}, bom dia, tudo bem? Espero que sim 😃
Só passando pra confirmar o banho do(a) ${pet} ${
    ehAmanha ? "amanhã" : "dia " + dataObj.toLocaleDateString("pt-BR")
  } às ${hora}. 🐶`;

  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`);
}

function lembretesHoje(){
  let hoje=new Date().toISOString().split("T")[0];

  agenda.forEach(a=>{
    if(a.data===hoje){
      let tutor=tutores.find(t=>t.nome===a.tutor);
      enviarWhats(tutor?.tel,a.tutor,a.pet,a.data,a.hora);
    }
  });
}

function render(){
  lista.innerHTML="";

  agenda.forEach((a,i)=>{
    let tutorObj=tutores.find(t=>t.nome===a.tutor);

    lista.innerHTML+=`
    <tr>
      <td>${new Date(a.data).toLocaleDateString()}</td>
      <td>${a.hora}</td>
      <td>${a.pet}</td>
      <td>${a.tutor}</td>
      <td class="status-${a.status.toLowerCase()}">${a.status}</td>
      <td>
        <button onclick="enviarWhats('${tutorObj?.tel}','${a.tutor}','${a.pet}','${a.data}','${a.hora}')">📲</button>
        <button onclick="alterarStatus(${i},'Confirmado')">✅</button>
        <button onclick="alterarStatus(${i},'Cancelado')">❌</button>
        <button onclick="alterarStatus(${i},'Faltou')">🚫</button>
      </td>
    </tr>`;
  });
}

function iniciar(){
  atualizar();
  render();
}

document.addEventListener("DOMContentLoaded", iniciar);
</script>

</body>
</html>
