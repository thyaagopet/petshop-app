<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Shop Pro+</title>

<style>
body { font-family: Arial; background:#ffe4ec; padding:10px;}
h1 { text-align:center; color:#e91e63;}
.card { background:white; padding:10px; border-radius:10px; margin-bottom:10px;}
input, select, button {
  width:100%; padding:8px; margin-top:5px; border-radius:6px; border:none;
}
button { background:#e91e63; color:white; font-weight:bold;}
table { width:100%; border-collapse:collapse; font-size:12px;}
th, td { border:1px solid #ccc; padding:5px; text-align:center;}
th { background:#e91e63; color:white;}
</style>
</head>

<body>

<h1>🐶 Pet Shop Pro+</h1>

<div class="card">
<h3>Tutor</h3>
<input id="tutorNome" placeholder="Nome">
<input id="tutorTel" placeholder="Telefone">
<button onclick="addTutor()">Salvar</button>
</div>

<div class="card">
<h3>Pet</h3>
<input id="petNome" placeholder="Nome do pet">
<select id="porte">
<option>Pequeno</option>
<option>Médio</option>
<option>Grande</option>
<option>Gigante</option>
</select>
<select id="tutorSelect"></select>
<button onclick="addPet()">Salvar Pet</button>
</div>

<div class="card">
<h3>Agendamento</h3>
<input type="date" id="data">
<input type="time" id="hora">
<select id="petSelect"></select>

<select id="servico">
<option value="50">Banho</option>
<option value="80">Tosa</option>
<option value="60">Remoção</option>
<option value="200">Pacote Semanal</option>
<option value="350">Pacote Quinzenal</option>
</select>

<button onclick="agendar()">Agendar</button>
</div>

<div class="card">
<h3>Agenda</h3>
<table>
<thead>
<tr>
<th>Data</th>
<th>Hora</th>
<th>Pet</th>
<th>Tutor</th>
<th>Serviço</th>
<th>Valor</th>
</tr>
</thead>
<tbody id="lista"></tbody>
</table>
</div>

<script>
let tutores = JSON.parse(localStorage.getItem("tutores") || "[]");
let pets = JSON.parse(localStorage.getItem("pets") || "[]");
let agenda = JSON.parse(localStorage.getItem("agenda") || "[]");

function salvar(){
  localStorage.setItem("tutores", JSON.stringify(tutores));
  localStorage.setItem("pets", JSON.stringify(pets));
  localStorage.setItem("agenda", JSON.stringify(agenda));
}

function atualizar(){
  const tutorSelect = document.getElementById("tutorSelect");
  const petSelect = document.getElementById("petSelect");

  tutorSelect.innerHTML="";
  petSelect.innerHTML="";

  tutores.forEach(t=>{
    let op=document.createElement("option");
    op.value=t.nome;
    op.textContent=t.nome;
    tutorSelect.appendChild(op);
  });

  pets.forEach(p=>{
    let op=document.createElement("option");
    op.value=p.nome;
    op.textContent=p.nome;
    petSelect.appendChild(op);
  });
}

function addTutor(){
  const nome=document.getElementById("tutorNome").value.trim();
  const tel=document.getElementById("tutorTel").value.trim();

  if(!nome) return;

  tutores.push({nome,tel});
  salvar();
  atualizar();
}

function addPet(){
  const nome=document.getElementById("petNome").value.trim();
  const porte=document.getElementById("porte").value;
  const tutor=document.getElementById("tutorSelect").value;

  if(!nome || !tutor) return;

  pets.push({nome,porte,tutor});
  salvar();
  atualizar();
}

function conflito(data,hora){
  return agenda.some(a=>a.data===data && a.hora===hora);
}

function agendar(){
  const data=document.getElementById("data").value;
  const hora=document.getElementById("hora").value;
  const petNome=document.getElementById("petSelect").value;
  const servicoSelect=document.getElementById("servico");

  const servicoNome=servicoSelect.options[servicoSelect.selectedIndex].text;
  const valor=parseFloat(servicoSelect.value);

  if(!data || !hora || !petNome) return;

  if(conflito(data,hora)){
    alert("Horário ocupado!");
    return;
  }

  const pet=pets.find(p=>p.nome===petNome);

  let repeticoes=1;
  if(servicoNome==="Pacote Semanal") repeticoes=4;
  if(servicoNome==="Pacote Quinzenal") repeticoes=2;

  for(let i=0;i<repeticoes;i++){
    let novaData=new Date(data);
    novaData.setDate(novaData.getDate()+7*i);

    agenda.push({
      data:novaData.toISOString().split("T")[0],
      hora,
      pet:pet.nome,
      tutor:pet.tutor,
      servico:servicoNome,
      valor
    });
  }

  salvar();
  render();
}

function render(){
  const lista=document.getElementById("lista");
  lista.innerHTML="";

  agenda
  .sort((a,b)=> new Date(a.data+" "+a.hora)-new Date(b.data+" "+b.hora))
  .forEach(a=>{
    lista.innerHTML+=`
    <tr>
      <td>${new Date(a.data).toLocaleDateString()}</td>
      <td>${a.hora}</td>
      <td>${a.pet}</td>
      <td>${a.tutor}</td>
      <td>${a.servico}</td>
      <td>R$ ${a.valor}</td>
    </tr>`;
  });
}

function iniciar(){
  atualizar();
  render();
}

document.addEventListener("DOMContentLoaded", iniciar);
</script>

</body>
</html>
