<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Shop Pro</title>

<style>
body { font-family: Arial; background:#ffe4ec; padding:10px;}
h1 { text-align:center; color:#e91e63;}
.card { background:white; padding:10px; border-radius:10px; margin-bottom:10px;}
input, select, button {
  width:100%; padding:8px; margin-top:5px; border-radius:6px; border:none;
}
button { background:#e91e63; color:white; font-weight:bold;}
table { width:100%; border-collapse:collapse; font-size:12px;}
th, td { border:1px solid #ccc; padding:5px; text-align:center;}
th { background:#e91e63; color:white;}
.total { font-weight:bold; margin-top:10px; }
</style>
</head>

<body>

<h1>🐶 Pet Shop Pro</h1>

<div class="card">
<h3>Tutor</h3>
<input id="tutorNome" placeholder="Nome">
<input id="tutorTel" placeholder="Telefone">
<button onclick="addTutor()">Salvar</button>
</div>

<div class="card">
<h3>Pet</h3>
<input id="petNome" placeholder="Nome do pet">
<select id="porte">
<option>Pequeno</option>
<option>Médio</option>
<option>Grande</option>
<option>Gigante</option>
</select>
<select id="tutorSelect"></select>
<button onclick="addPet()">Salvar Pet</button>
</div>

<div class="card">
<h3>Agendamento</h3>
<input type="date" id="data">
<input type="time" id="hora">
<select id="petSelect"></select>

<select id="servico">
<option value="50">Banho</option>
<option value="80">Tosa</option>
<option value="60">Remoção</option>
<option value="200">Pacote Semanal</option>
</select>

<button onclick="agendar()">Agendar</button>
</div>

<div class="card">
<h3>Agenda</h3>
<table>
<thead>
<tr>
<th>Data</th>
<th>Hora</th>
<th>Pet</th>
<th>Tutor</th>
<th>Serviço</th>
<th>Valor</th>
<th>Ação</th>
</tr>
</thead>
<tbody id="lista"></tbody>
</table>

<div class="total" id="totalDia"></div>
</div>

<script>
let tutores = JSON.parse(localStorage.getItem("tutores") || "[]");
let pets = JSON.parse(localStorage.getItem("pets") || "[]");
let agenda = JSON.parse(localStorage.getItem("agenda") || "[]");

function salvar(){
  localStorage.setItem("tutores", JSON.stringify(tutores));
  localStorage.setItem("pets", JSON.stringify(pets));
  localStorage.setItem("agenda", JSON.stringify(agenda));
}

function atualizar(){
  tutorSelect.innerHTML="";
  petSelect.innerHTML="";

  tutores.forEach(t=>{
    tutorSelect.innerHTML += `<option>${t.nome}</option>`;
  });

  pets.forEach(p=>{
    petSelect.innerHTML += `<option>${p.nome}</option>`;
  });
}

function addTutor(){
  let nome=tutorNome.value;
  let tel=tutorTel.value;
  if(!nome) return;

  tutores.push({nome,tel});
  salvar(); atualizar();
}

function addPet(){
  let nome=petNome.value;
  let porte=porte.value;
  let tutor=tutorSelect.value;

  if(!nome || !tutor) return;

  pets.push({nome,porte,tutor});
  salvar(); atualizar();
}

function conflito(data,hora){
  return agenda.some(a=>a.data===data && a.hora===hora);
}

function agendar(){
  let data=document.getElementById("data").value;
  let hora=document.getElementById("hora").value;
  let petNome=petSelect.value;
  let servicoSelect=document.getElementById("servico");
  let servicoNome=servicoSelect.options[servicoSelect.selectedIndex].text;
  let valor=parseFloat(servicoSelect.value);

  if(!data||!hora||!petNome) return;

  if(conflito(data,hora)){
    alert("Horário já ocupado!");
    return;
  }

  let pet=pets.find(p=>p.nome===petNome);

  if(servicoNome==="Pacote Semanal"){
    for(let i=0;i<4;i++){
      let novaData=new Date(data);
      novaData.setDate(novaData.getDate()+7*i);

      agenda.push({
        data:novaData.toISOString().split("T")[0],
        hora
