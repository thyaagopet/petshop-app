<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Pet Shop</title>

<style>
body {
  font-family: Arial;
  background: #ffe4ec;
  padding: 10px;
}

h1 {
  text-align: center;
  color: #e91e63;
}

.card {
  background: white;
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 10px;
}

input, select, button {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  border-radius: 6px;
  border: none;
}

button {
  background: #e91e63;
  color: white;
  font-weight: bold;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

th, td {
  border: 1px solid #ccc;
  text-align: center;
  padding: 5px;
}

th {
  background: #e91e63;
  color: white;
}
</style>
</head>

<body>

<h1>🐶 Agenda Pet Shop</h1>

<div class="card">
<h3>Cadastrar Tutor</h3>
<input id="tutorNome" placeholder="Nome">
<input id="tutorTel" placeholder="Telefone">
<button onclick="addTutor()">Salvar</button>
</div>

<div class="card">
<h3>Cadastrar Pet</h3>
<input id="petNome" placeholder="Nome do pet">

<select id="porte">
<option>Pequeno</option>
<option>Médio</option>
<option>Grande</option>
<option>Gigante</option>
</select>

<select id="tutorSelect"></select>

<button onclick="addPet()">Salvar Pet</button>
</div>

<div class="card">
<h3>Agendar</h3>

<select id="dia">
<option>Segunda</option>
<option>Terça</option>
<option>Quarta</option>
<option>Quinta</option>
<option>Sexta</option>
<option>Sábado</option>
</select>

<input type="time" id="hora">

<select id="petSelect"></select>

<button onclick="agendar()">Agendar</button>
</div>

<div class="card">
<h3>Agenda Semanal</h3>

<table id="tabela">
<thead>
<tr>
<th>Hora</th>
<th>Seg</th>
<th>Ter</th>
<th>Qua</th>
<th>Qui</th>
<th>Sex</th>
<th>Sáb</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>
let tutores = JSON.parse(localStorage.getItem("tutores") || "[]");
let pets = JSON.parse(localStorage.getItem("pets") || "[]");
let agenda = JSON.parse(localStorage.getItem("agenda") || "[]");

const dias = ["Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];

function salvar(){
  localStorage.setItem("tutores", JSON.stringify(tutores));
  localStorage.setItem("pets", JSON.stringify(pets));
  localStorage.setItem("agenda", JSON.stringify(agenda));
}

function atualizarSelects(){
  tutorSelect.innerHTML="";
  petSelect.innerHTML="";

  tutores.forEach(t=>{
    tutorSelect.innerHTML += `<option>${t.nome}</option>`;
  });

  pets.forEach(p=>{
    petSelect.innerHTML += `<option>${p.nome}</option>`;
  });
}

function addTutor(){
  const nome = tutorNome.value;
  const tel = tutorTel.value;

  if(!nome) return;

  tutores.push({nome,tel});
  salvar();
  atualizarSelects();
}

function addPet(){
  const nome = petNome.value;
  const porte = porte.value;
  const tutor = tutorSelect.value;

  if(!nome || !tutor) return;

  pets.push({nome,porte,tutor});
  salvar();
  atualizarSelects();
}

function agendar(){
  const dia = document.getElementById("dia").value;
  const hora = document.getElementById("hora").value;
  const petNome = document.getElementById("petSelect").value;

  if(!hora || !petNome) return;

  const pet = pets.find(p=>p.nome===petNome);

  agenda.push({
    dia,
    hora,
    pet: pet.nome,
    tutor: pet.tutor
  });

  salvar();
  renderTabela();
}

function renderTabela(){
  const tbody = document.querySelector("#tabela tbody");
  tbody.innerHTML="";

  for(let h=9; h<=19; h++){
    let linha = `<tr><td>${h}:00</td>`;

    dias.forEach(d=>{
      const item = agenda.find(a=>a.dia===d && a.hora.startsWith(h.toString().padStart(2,"0")));

      if(item){
        linha += `<td>${item.pet}<br><small>${item.tutor}</small></td>`;
      } else {
        linha += `<td></td>`;
      }
    });

    linha += "</tr>";
    tbody.innerHTML += linha;
  }
}

function iniciar(){
  atualizarSelects();
  renderTabela();
}

iniciar();
</script>

</body>
</html>
